# Drop this in YOUR mod repo at .github/workflows/build.yml. It builds against the game
# image from build-on-demand.yml or watch-and-build.yml in this same examples/ folder.
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: read   # pull the private game image
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Stage real game assemblies from the image
        env:
          GAME_IMAGE: ghcr.io/${{ github.repository_owner }}/rimworld-game:latest
        run: |
          set -euo pipefail
          img="$(printf '%s' "$GAME_IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull -q "$img"
          cid="$(docker create "$img")"
          # Stage where a typical RimWorld .csproj looks for a local install.
          sudo mkdir -p /mnt/games/RimWorld
          sudo chown "$(id -u):$(id -g)" /mnt/games/RimWorld
          docker cp "$cid:/game/RimWorldLinux_Data" /mnt/games/RimWorld/RimWorldLinux_Data
          docker rm -f "$cid" >/dev/null
          test -f /mnt/games/RimWorld/RimWorldLinux_Data/Managed/Assembly-CSharp.dll
          echo "Staged real assemblies at /mnt/games/RimWorld"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Build the mod
        run: |
          # Your .csproj references the staged path, guarded so a fresh clone still loads:
          #   <Reference Include="/mnt/games/RimWorld/RimWorldLinux_Data/Managed/*.dll" Condition="Exists('/mnt/games/RimWorld/RimWorldLinux_Data/Managed')" />
          dotnet build YourMod.sln -c Release
