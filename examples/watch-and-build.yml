# Drop this in YOUR repo at .github/workflows/rimworld-image-watch.yml
# A scheduled run costs almost nothing when Steam has not moved: the build-id gate
# compares the published buildid to your image's steam.buildid label and, when they
# match, downloads no bytes at all.
name: rimworld-image-watch

on:
  workflow_dispatch:
  schedule:
    # every 30 min; off the :00/:30 marks to be a good registry/Steam citizen
    - cron: "7,37 * * * *"

jobs:
  build:
    uses: RimWorks/steam-game-image-action/.github/workflows/build-image.yml@v4
    with:
      image: ghcr.io/${{ github.repository_owner }}/rimworld-game
      steam-username: your-steam-account
      game: rimworld
      branch: public
      skip-if-unchanged: "true"
    secrets:
      steam-config-vdf: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}
