name: "Build Steam game image"
description: "Download a Steam game with steamcmd and push it as a private OCI image to a registry you control."
author: RimWorks
branding:
  icon: download-cloud
  color: blue

inputs:
  steam-username:
    description: >-
      Steam account name. Leave it and steam-config-vdf empty when the run has no secrets
      (a pull request from a fork): the action then skips the build and outputs the
      image:latest-<branch> a credentialed run already pushed.
    required: false
    default: ""
  steam-config-vdf:
    description: "base64 of a logged-in steamcmd config.vdf. Empty means no Steam access, see steam-username."
    required: false
    default: ""
  app-id:
    description: "Steam app id to download."
    required: false
    default: "294100"
  branch:
    description: "Steam branch to install (e.g. public, 1.5, 1.4)."
    required: false
    default: "public"
  branch-password:
    description: "Password for a password-protected beta branch (optional)."
    required: false
    default: ""
  steam-platform:
    description: >-
      Depot platform to download (linux, windows, macos). Empty (default) = the
      platform steamcmd runs on. Pair 'windows' with a Proton-capable base-image;
      the default runtime base has no wine.
    required: false
    default: ""
  image:
    description: "Target image ref WITHOUT a tag, e.g. ghcr.io/you/rimworld-game."
    required: true
  registry:
    description: "Registry host for auth (default ghcr.io)."
    required: false
    default: "ghcr.io"
  registry-username:
    description: "Registry username (default the GitHub actor)."
    required: false
    default: ${{ github.actor }}
  registry-password:
    description: "Registry token/password. For GHCR pass secrets.GITHUB_TOKEN (needs packages: write)."
    required: true
  base-image:
    description: "Base image to append the game layer onto. Empty = auto (runtime-base if runnable, else a minimal base)."
    required: false
    default: ""
  runnable:
    description: "true = append onto the xvfb/native-deps runtime base (launchable); false = minimal build/reference base."
    required: false
    default: "true"
  runtime-base-image:
    description: "Override the default public runtime base image."
    required: false
    default: "ghcr.io/rimworks/steam-game-image-action/runtime-base:latest"
  minimal-base-image:
    description: "Base used when runnable=false."
    required: false
    default: "debian:stable-slim"
  game-path:
    description: "Path the game is placed at inside the image."
    required: false
    default: "/game"
  platform:
    description: "Image platform."
    required: false
    default: "linux/amd64"
  crane-version:
    description: "go-containerregistry (crane) version to install. Override it and you must set crane-sha256 too."
    required: false
    default: "0.20.2"
  crane-sha256:
    description: "sha256 of the crane linux x86_64 tarball. Defaults to the hash for crane-version's default."
    required: false
    default: "c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b"
  require-private:
    description: "true = fail when the pushed image is anonymously pullable. A game image must never be public."
    required: false
    default: "true"
  skip-if-unchanged:
    description: "true = compare the published buildid to the image's steam.buildid label and skip when unchanged."
    required: false
    default: "true"
  include-paths:
    description: >-
      Space/newline-separated subpaths (relative to the game install dir) to include
      in the image. Empty (default) = the whole game (runnable). Set e.g.
      'RimWorldLinux_Data/Managed' for a tiny build/reference image with just the
      managed assemblies. Pair a subset with runnable=false.
    required: false
    default: ""

outputs:
  image-ref:
    description: "Image ref to consume: image:version when built, image:latest-<branch> when the build was skipped or the run had no Steam credentials."
    value: ${{ steps.build.outputs.image-ref || steps.gate.outputs.image-ref || steps.reuse.outputs.image-ref }}
  version:
    description: "The version tag used."
    value: ${{ steps.build.outputs.version }}
  buildid:
    description: "The Steam buildid that was built."
    value: ${{ steps.gate.outputs.published }}
  skipped:
    description: "true if the build was skipped: the buildid was unchanged, or the run had no Steam credentials."
    value: ${{ steps.gate.outputs.skipped || steps.reuse.outputs.skipped }}

runs:
  using: composite
  steps:
    - name: Install steamcmd, crane, jq
      shell: bash
      env:
        CRANE_VERSION: ${{ inputs.crane-version }}
        CRANE_SHA256: ${{ inputs.crane-sha256 }}
      run: |
        set -euo pipefail
        # Retry transient mirror hiccups (the runner's packages.microsoft.com source
        # intermittently returns "Resource temporarily unavailable"); none of the
        # packages below come from it, so a flaky refresh of it should not warn.
        sudo apt-get -o Acquire::Retries=3 update -qq
        sudo apt-get install -y -qq --no-install-recommends ca-certificates curl tar jq lib32gcc-s1 >/dev/null
        mkdir -p "$HOME/.steamcmd"
        # valve ships steamcmd from one unversioned url, so there is no stable hash to pin.
        curl -sqL --proto '=https' --proto-redir '=https' https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
          | tar zxf - -C "$HOME/.steamcmd"
        printf '#!/bin/sh\nexec "%s/steamcmd.sh" "$@"\n' "$HOME/.steamcmd" | sudo tee /usr/local/bin/steamcmd >/dev/null
        sudo chmod +x /usr/local/bin/steamcmd
        # crane runs with the registry password on stdin, so the hash is pinned here rather
        # than taken from the release's own checksums.txt, which proves nothing
        if [ "$CRANE_VERSION" != "0.20.2" ] && [ "$CRANE_SHA256" = "c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b" ]; then
          echo "::error::crane-version is $CRANE_VERSION but crane-sha256 is still the 0.20.2 default." \
               "Set crane-sha256 to that release's go-containerregistry_Linux_x86_64.tar.gz hash." >&2
          exit 1
        fi
        curl -sSL --proto '=https' --proto-redir '=https' -o /tmp/crane.tar.gz \
          "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
        echo "${CRANE_SHA256}  /tmp/crane.tar.gz" | sha256sum -c -
        sudo tar -xzf /tmp/crane.tar.gz -C /usr/local/bin crane
        rm -f /tmp/crane.tar.gz

    - name: Check for Steam credentials
      id: creds
      shell: bash
      env:
        STEAM_USERNAME: ${{ inputs.steam-username }}
        STEAM_CONFIG_VDF_B64: ${{ inputs.steam-config-vdf }}
      run: |
        set -euo pipefail
        if [ -n "$STEAM_USERNAME" ] && [ -n "$STEAM_CONFIG_VDF_B64" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "no Steam credentials; the image a credentialed run pushed is reused instead"
        fi

    - name: Steam login
      if: steps.creds.outputs.present == 'true'
      shell: bash
      env:
        STEAM_CONFIG_VDF_B64: ${{ inputs.steam-config-vdf }}
      run: "${{ github.action_path }}/scripts/steam-login.sh"

    - name: Resolve base image
      id: base
      shell: bash
      env:
        BASE_IMAGE: ${{ inputs.base-image }}
        RUNNABLE: ${{ inputs.runnable }}
        RUNTIME_BASE_IMAGE: ${{ inputs.runtime-base-image }}
        MINIMAL_BASE_IMAGE: ${{ inputs.minimal-base-image }}
        IMAGE: ${{ inputs.image }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        if [ -n "$BASE_IMAGE" ]; then
          base="$BASE_IMAGE"
        elif [ "$RUNNABLE" = "true" ]; then
          base="$RUNTIME_BASE_IMAGE"
        else
          base="$MINIMAL_BASE_IMAGE"
        fi
        echo "base=$base" >> "$GITHUB_OUTPUT"
        echo "resolved base image: $base"
        # OCI refs must be lowercase; github.repository_owner can be mixed-case.
        image="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "resolved image: $image"
        # A branch-scoped latest tag keeps multi-branch matrices (public + a
        # beta branch on one image ref) from fighting over a single :latest.
        branch_tag="latest-$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')"
        echo "branch-tag=$branch_tag" >> "$GITHUB_OUTPUT"
        echo "resolved branch tag: $branch_tag"

    - name: Build-id gate
      id: gate
      if: steps.creds.outputs.present == 'true'
      shell: bash
      env:
        STEAM_USERNAME: ${{ inputs.steam-username }}
        APP_ID: ${{ inputs.app-id }}
        BRANCH: ${{ inputs.branch }}
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USER: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        IMAGE: ${{ steps.base.outputs.image }}
        BRANCH_TAG: ${{ steps.base.outputs.branch-tag }}
        SKIP_IF_UNCHANGED: ${{ inputs.skip-if-unchanged }}
      run: |
        set -euo pipefail
        published="$(STEAM_USERNAME="$STEAM_USERNAME" APP_ID="$APP_ID" BRANCH="$BRANCH" \
          bash "${{ github.action_path }}/scripts/published-buildid.sh" || true)"
        echo "published='$published'"
        echo "published=$published" >> "$GITHUB_OUTPUT"
        if [ "$SKIP_IF_UNCHANGED" != "true" ]; then
          echo "skipped=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        printf '%s' "$REGISTRY_PASSWORD" | crane auth login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
        built="$(crane config "$IMAGE:$BRANCH_TAG" 2>/dev/null | jq -r '.config.Labels["steam.buildid"] // ""' || true)"
        echo "built='$built'"
        if [ -n "$published" ] && [ "$published" = "$built" ]; then
          echo "up to date; skipping build"
          echo "skipped=true" >> "$GITHUB_OUTPUT"
          echo "image-ref=$IMAGE:$BRANCH_TAG" >> "$GITHUB_OUTPUT"
        else
          echo "skipped=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Reuse the published image
      id: reuse
      if: steps.creds.outputs.present != 'true'
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USER: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        IMAGE: ${{ steps.base.outputs.image }}
        BRANCH_TAG: ${{ steps.base.outputs.branch-tag }}
      run: |
        set -euo pipefail
        ref="$(bash "${{ github.action_path }}/scripts/reuse-existing.sh")"
        echo "skipped=true" >> "$GITHUB_OUTPUT"
        echo "image-ref=$ref" >> "$GITHUB_OUTPUT"
        echo "reusing $ref"

    - name: Restore game install cache
      id: game-cache
      if: steps.creds.outputs.present == 'true' && steps.gate.outputs.skipped != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        # Restore the prior install so steamcmd app_update fetches only the delta.
        # The exact-buildid key never hits on a real rebuild (the gate only lets us
        # here when the buildid changed), so the prefix restore-key restores the most
        # recent install and a fresh entry is saved post-job under the new buildid.
        path: ${{ runner.temp }}/steam-game
        key: steam-${{ inputs.app-id }}-${{ inputs.branch }}-${{ inputs.steam-platform != '' && inputs.steam-platform || 'host' }}-${{ steps.gate.outputs.published }}
        restore-keys: |
          steam-${{ inputs.app-id }}-${{ inputs.branch }}-${{ inputs.steam-platform != '' && inputs.steam-platform || 'host' }}-

    - name: Download game
      if: steps.creds.outputs.present == 'true' && steps.gate.outputs.skipped != 'true'
      shell: bash
      env:
        STEAM_USERNAME: ${{ inputs.steam-username }}
        APP_ID: ${{ inputs.app-id }}
        BRANCH: ${{ inputs.branch }}
        BRANCH_PASSWORD: ${{ inputs.branch-password }}
        # Never name this STEAM_PLATFORM: steamcmd.sh picks its own binary directory from
        # that variable, so it would hunt for .steamcmd/windows/steamcmd and exit.
        DEPOT_PLATFORM: ${{ inputs.steam-platform }}
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP:-/tmp}/steam-game"
        mkdir -p "$dir"
        beta=(); [ "$BRANCH" != "public" ] && beta=(-beta "$BRANCH")
        [ -n "$BRANCH_PASSWORD" ] && beta+=(-betapassword "$BRANCH_PASSWORD")
        plat=(); [ -n "$DEPOT_PLATFORM" ] && plat=(+@sSteamCmdForcePlatformType "$DEPOT_PLATFORM")
        steamcmd \
          +@ShutdownOnFailedCommand 1 \
          +@NoPromptForPassword 1 \
          "${plat[@]}" \
          +force_install_dir "$dir" \
          +login "$STEAM_USERNAME" \
          +app_update "$APP_ID" "${beta[@]}" validate \
          +quit
        echo "GAME_DIR=$dir" >> "$GITHUB_ENV"

    # steamcmd exits 0 on a partial update, so a half-downloaded install used to ship and then
    # get saved back to the cache, poisoning every later build.
    - name: Verify game install
      if: steps.creds.outputs.present == 'true' && steps.gate.outputs.skipped != 'true'
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        WANT: ${{ steps.gate.outputs.published }}
      run: |
        set -euo pipefail
        acf="$GAME_DIR/steamapps/appmanifest_${APP_ID}.acf"
        [ -f "$acf" ] || { echo "no appmanifest at $acf - the download never ran" >&2; exit 1; }
        state="$(grep -oP '"StateFlags"\s+"\K[0-9]+' "$acf")"
        got="$(grep -oP '"buildid"\s+"\K[0-9]+' "$acf")"
        [ "$state" = 4 ] || { echo "StateFlags=$state, want 4 (fully installed)" >&2; exit 1; }
        # WANT is empty when the buildid lookup failed; the gate tolerates that, so we do too.
        if [ -n "$WANT" ] && [ "$got" != "$WANT" ]; then
          echo "buildid=$got, want $WANT" >&2
          exit 1
        fi

    - name: Save game install cache
      if: steps.creds.outputs.present == 'true' && steps.gate.outputs.skipped != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/steam-game
        key: steam-${{ inputs.app-id }}-${{ inputs.branch }}-${{ inputs.steam-platform != '' && inputs.steam-platform || 'host' }}-${{ steps.gate.outputs.published }}

    - name: Build and push image
      id: build
      if: steps.creds.outputs.present == 'true' && steps.gate.outputs.skipped != 'true'
      shell: bash
      env:
        IMAGE: ${{ steps.base.outputs.image }}
        BASE_IMAGE: ${{ steps.base.outputs.base }}
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USER: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        STEAM_BUILDID: ${{ steps.gate.outputs.published }}
        BRANCH_TAG: ${{ steps.base.outputs.branch-tag }}
        GAME_PATH: ${{ inputs.game-path }}
        PLATFORM: ${{ inputs.platform }}
        INCLUDE_PATHS: ${{ inputs.include-paths }}
      run: "${{ github.action_path }}/scripts/build-image.sh"

    - name: Refuse to leave the image public
      if: inputs.require-private == 'true'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        REGISTRY: ${{ inputs.registry }}
      run: |
        # runs even when the build-id gate skipped: the image still exists, and it can be
        # flipped public in the registry ui long after the last push
        name="${IMAGE#"${REGISTRY}/"}"
        "${{ github.action_path }}/scripts/assert-private.sh" "$REGISTRY" "$name"

    - name: Wipe Steam credentials
      if: always()
      shell: bash
      run: rm -rf "$HOME/Steam" "$HOME/.steam" "$HOME/.local/share/Steam" || true
