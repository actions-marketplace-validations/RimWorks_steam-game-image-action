name: "Build Steam game image"
description: "Download a Steam game with gamecrate and push it as a private OCI image to a registry you control."
author: RimWorks
branding:
  icon: download-cloud
  color: blue

inputs:
  game:
    description: "Game the plugin provides, e.g. rimworld."
    required: false
    default: "rimworld"
  plugin:
    description: "Plugin package supplying the game facts. One per line. Empty = @gamecrate/<game>."
    required: false
    default: ""
  gamecrate-version:
    description: "Version of @gamecrate/cli to install. Empty = latest. Needs 3.0.0 or newer."
    required: false
    default: ""
  steam-username:
    description: >-
      Steam account name. Leave it and steam-config-vdf empty when the run has no secrets
      (a pull request from a fork): the action then skips the build and outputs the
      image:latest-<branch> a credentialed run already pushed.
    required: false
    default: ""
  steam-config-vdf:
    description: "base64 of a logged-in steamcmd config.vdf. Empty means no Steam access, see steam-username."
    required: false
    default: ""
  branch:
    description: "Steam branch to build. Empty = every branch the plugin declares."
    required: false
    default: "public"
  branch-password:
    description: "Password for a password-protected beta branch (optional)."
    required: false
    default: ""
  aliases:
    description: "Newline or comma separated extra moving tags, e.g. 1.6 so a consumer can pull a short ref."
    required: false
    default: ""
  variant:
    description: "Image variant to build. Empty = every variant the plugin declares."
    required: false
    default: ""
  image:
    description: "Target image ref WITHOUT a tag, e.g. ghcr.io/you/rimworld-game."
    required: true
  registry:
    description: "Registry host for auth (default ghcr.io)."
    required: false
    default: "ghcr.io"
  registry-username:
    description: "Registry username (default the GitHub actor)."
    required: false
    default: ${{ github.actor }}
  registry-password:
    description: "Registry token/password. For GHCR pass secrets.GITHUB_TOKEN (needs packages: write)."
    required: true
  base-image:
    description: "Override the published runtime base a variant appends onto."
    required: false
    default: ""
  platform:
    description: "Image platform."
    required: false
    default: "linux/amd64"
  require-private:
    description: "true = fail when the pushed image is anonymously pullable. A game image must never be public."
    required: false
    default: "true"
  skip-if-unchanged:
    description: "true = skip a cell whose published buildid matches the image's steam.buildid label."
    required: false
    default: "true"

outputs:
  image-ref:
    description: "Image ref to consume, or the ref a credentialed run already pushed when this run had no secrets."
    value: ${{ steps.build.outputs.image-ref || steps.reuse.outputs.image-ref }}
  results:
    description: "JSON array, one entry per branch and variant, with its status, reason and tags."
    value: ${{ steps.build.outputs.results }}
  skipped:
    description: "true when every cell was skipped, or the run had no Steam credentials."
    value: ${{ steps.build.outputs.skipped || steps.reuse.outputs.skipped }}

runs:
  using: composite
  steps:
    - name: Resolve the image ref
      id: ref
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        # OCI refs must be lowercase; github.repository_owner can be mixed case.
        image="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        # gamecrate computes the same tag. this copy only serves the no-credentials path.
        tag="latest"
        [ -n "$BRANCH" ] && [ "$BRANCH" != "public" ] &&
          tag="latest-$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')"
        echo "branch-tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Check for Steam credentials
      id: creds
      shell: bash
      env:
        STEAM_USERNAME: ${{ inputs.steam-username }}
        STEAM_CONFIG_VDF_B64: ${{ inputs.steam-config-vdf }}
      run: |
        set -euo pipefail
        # A fork pull request gets no secrets. That is not a failure: it reuses what a
        # credentialed run already pushed, so a contributor still gets a green build.
        if [ -n "$STEAM_USERNAME" ] && [ -n "$STEAM_CONFIG_VDF_B64" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "no Steam credentials; the image a credentialed run pushed is reused instead"
        fi

    - name: Reuse the published image
      id: reuse
      if: steps.creds.outputs.present != 'true'
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USER: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        IMAGE: ${{ steps.ref.outputs.image }}
        BRANCH_TAG: ${{ steps.ref.outputs.branch-tag }}
      run: |
        set -euo pipefail
        ref="$(bash "${{ github.action_path }}/scripts/reuse-existing.sh")"
        echo "skipped=true" >> "$GITHUB_OUTPUT"
        echo "image-ref=$ref" >> "$GITHUB_OUTPUT"
        echo "reusing $ref"

    - name: Install gamecrate
      if: steps.creds.outputs.present == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.gamecrate-version }}
        PLUGINS: ${{ inputs.plugin }}
        GAME: ${{ inputs.game }}
      run: |
        set -euo pipefail
        cli="@gamecrate/cli"
        [ -n "$VERSION" ] && cli="$cli@$VERSION"
        # without a plugin gamecrate knows nothing about this game, so the convention wins
        packages="$(printf '%s\n' "$PLUGINS" | grep -v '^[[:space:]]*$' || true)"
        [ -z "$packages" ] && packages="@gamecrate/$GAME"
        npm install -g --no-fund --no-audit "$cli"
        # shellcheck disable=SC2086
        npm install --no-fund --no-audit --no-save $packages
        gamecrate --help >/dev/null

    - name: Restore the game download cache
      if: steps.creds.outputs.present == 'true'
      uses: actions/cache/restore@v6
      with:
        # one entry per <appid>-<branch>-<depot>, so variants sharing a depot share a cache
        path: ~/.local/share/gamecrate/steam/apps
        key: gamecrate-steam-${{ inputs.game }}-${{ inputs.branch }}-${{ github.run_id }}
        restore-keys: |
          gamecrate-steam-${{ inputs.game }}-${{ inputs.branch }}-

    - name: Build and push the image
      id: build
      if: steps.creds.outputs.present == 'true'
      shell: bash
      env:
        GAME: ${{ inputs.game }}
        IMAGE: ${{ steps.ref.outputs.image }}
        BRANCH: ${{ inputs.branch }}
        VARIANT: ${{ inputs.variant }}
        ALIASES: ${{ inputs.aliases }}
        BASE_IMAGE: ${{ inputs.base-image }}
        PLATFORM: ${{ inputs.platform }}
        BRANCH_TAG: ${{ steps.ref.outputs.branch-tag }}
        SKIP_IF_UNCHANGED: ${{ inputs.skip-if-unchanged }}
        STEAM_USERNAME: ${{ inputs.steam-username }}
        STEAM_CONFIG_VDF_B64: ${{ inputs.steam-config-vdf }}
        STEAM_BRANCH_PASSWORD: ${{ inputs.branch-password }}
        GAMECRATE_REGISTRY_USER: ${{ inputs.registry-username }}
        GAMECRATE_REGISTRY_PASSWORD: ${{ inputs.registry-password }}
      run: "${{ github.action_path }}/scripts/build.sh"

    - name: Save the game download cache
      if: steps.creds.outputs.present == 'true' && steps.build.outputs.downloaded == 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.local/share/gamecrate/steam/apps
        key: gamecrate-steam-${{ inputs.game }}-${{ inputs.branch }}-${{ github.run_id }}

    - name: Refuse to leave the image public
      if: inputs.require-private == 'true'
      shell: bash
      env:
        IMAGE: ${{ steps.ref.outputs.image }}
        REGISTRY: ${{ inputs.registry }}
      run: |
        # runs even when every cell skipped: the image can be flipped public in the ui
        # long after the last push
        name="${IMAGE#"${REGISTRY}/"}"
        "${{ github.action_path }}/scripts/assert-private.sh" "$REGISTRY" "$name"

    - name: Wipe Steam credentials
      if: always()
      shell: bash
      run: |
        # the session is a live credential. it does not outlive the job that used it
        rm -rf "${HOME}/.local/share/gamecrate/steam/.steam" "${HOME}/.steam" || true
