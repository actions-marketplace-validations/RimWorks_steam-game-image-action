name: test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck scripts/*.sh tests/*.sh
      - name: parser tests
        run: |
          bash tests/test-published-buildid.sh
          bash tests/test-reuse-existing.sh
      - name: actionlint
        run: |
          set -euo pipefail
          # pinned and checksummed: this job gates the release, so a floating version
          # or a swapped binary could poison a publish.
          curl --proto '=https' --tlsv1.2 -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint
