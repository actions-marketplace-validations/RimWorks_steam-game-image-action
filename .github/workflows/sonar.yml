name: sonar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    uses: RimWorks/mod-ci/.github/workflows/sonar-scan.yml@2b12ceb52c4db9a43964846dd92dd4eeb8cb73cb # v1.15.0
    with:
      project-key: RimWorks_steam-game-image-action
      exclusions: tests/fixtures/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
