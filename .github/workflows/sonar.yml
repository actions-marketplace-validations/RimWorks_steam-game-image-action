name: sonar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    uses: RimWorks/mod-ci/.github/workflows/sonar-scan.yml@1aff522264ea1c6b7ae3628a765fbd658160baa1 # v4.1.1
    with:
      project-key: RimWorks_steam-game-image-action
      exclusions: tests/fixtures/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
