# Reusable workflow: build and push a private Steam game image.
# Calling it from your own repo is documented in README.md.
name: build-image

on:
  workflow_call:
    inputs:
      image:
        description: "Target image ref without tag, e.g. ghcr.io/you/rimworld-game."
        required: true
        type: string
      steam-username:
        description: "Steam account name (not secret)."
        required: true
        type: string
      game:
        required: false
        type: string
        default: "rimworld"
      plugin:
        description: "Plugin packages supplying the game facts, one per line."
        required: false
        type: string
        default: ""
      branch:
        required: false
        type: string
        default: "public"
      variant:
        required: false
        type: string
        default: ""
      skip-if-unchanged:
        required: false
        type: string
        default: "true"
      registry:
        required: false
        type: string
        default: "ghcr.io"
    secrets:
      steam-config-vdf:
        required: true
      registry-password:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build-image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: RimWorks/steam-game-image-action@v4
        with:
          game: ${{ inputs.game }}
          plugin: ${{ inputs.plugin }}
          steam-username: ${{ inputs.steam-username }}
          steam-config-vdf: ${{ secrets.steam-config-vdf }}
          branch: ${{ inputs.branch }}
          variant: ${{ inputs.variant }}
          image: ${{ inputs.image }}
          registry: ${{ inputs.registry }}
          registry-password: ${{ secrets.registry-password }}
          skip-if-unchanged: ${{ inputs.skip-if-unchanged }}
