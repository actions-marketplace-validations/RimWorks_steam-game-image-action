name: runtime-base

# The public, game-free base the action appends the game layer onto. The action
# always consumes runtime-base:latest, so this only needs to rebuild when its
# Dockerfile changes (or on demand) - not on every action release.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.runtime-base
      - Dockerfile.runtime-base-proton
      - scripts/run-headless-windows.sh
      - scripts/run-headless.sh
      - scripts/headless-common.sh
      - .github/workflows/runtime-base.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  runtime-base:
    name: build+push runtime-base
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Build and push runtime-base
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IMG="ghcr.io/${REPO,,}/runtime-base"
          docker build --pull -f Dockerfile.runtime-base -t "$IMG:latest" .
          docker push "$IMG:latest"

  runtime-base-proton:
    name: build+push runtime-base-proton
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Build and push runtime-base-proton
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IMG="ghcr.io/${REPO,,}/runtime-base-proton"
          docker build --pull -f Dockerfile.runtime-base-proton -t "$IMG:latest" .
          docker push "$IMG:latest"
